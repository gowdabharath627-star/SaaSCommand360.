name: SaaSCommand 360 CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Data Generator & Medallion Pipeline
        run: |
          python data/generator.py
          python warehouse/pipeline.py

      - name: Run Data Quality Suite
        run: |
          python warehouse/data_quality.py

      - name: Run Machine Learning Training
        run: |
          python ml/churn_model.py
          python ml/expansion_model.py
          python decision_engine/rules.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest backend/tests/test_api.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build
