version: '3.8'

services:
  # Optional local PostgreSQL service if not using Neon Postgres cloud
  postgres:
    image: postgres:16-alpine
    container_name: saascommand360_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: saascommand360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Engine
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: saascommand360_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/saascommand360
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  # React / Tailwind Command Center UI
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: saascommand360_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
